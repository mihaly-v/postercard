<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass UI Generator (Canvas Single Source)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- コントロールパネル -->
        <div class="controls-panel">
            <div class="control-section glass">
                <h3>FILE:</h3>
                <div class="control-row">
                    <div class="control-group"  style="flex: 1;">
                        <label>Card Type</label>
                        <select id="resolutionSelect">
                            <option value="1000x1593" selected>PORTRAIT (1000×1593)</option>
                            <option value="1593x1000">LANDSCAPE (1593×1000)</option>
                        </select>
                    </div>
                    <div class="control-group"  style="flex: 1;">
                        <label>Upload Image</label>
                        <input type="file" id="imageLoader" accept="image/*">
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group">
                        <label>&nbsp;</label>
                        <button class="btn" id="saveImgBtn" style="background: rgba(255,255,255,0.25); font-weight: bold;">DOWNLOAD IMAGE FILE</button>
                    </div>
                </div>
            </div>

            <div class="control-section glass">
                <h3>STYLE:</h3>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Blur Intensity: <span id="blurVal">14</span>px</label>
                        <input type="range" id="blurIntensity" min="0" max="35" value="14">
                    </div>
                    <!-- <div class="control-group" style="justify-content: flex-end; max-width: 90px;">
                        <label>&nbsp;</label>
                        <button class="btn" id="resetImgBtn">RESET</button>
                    </div> -->
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Texture</label>
                        <select id="textureType">
                            <option value="frosted" selected>FROSTED GLASS</option>
                            <option value="grain">FILM GRAIN</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Texture intensity: <span id="grainVal">100</span>%</label>
                        <input type="range" id="grainIntensity" min="0" max="100" value="100">
                    </div>
                    
                </div>
                
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Inside Saturation: <span id="insideSatVal">100</span>%</label>
                        <input type="range" id="insideSaturation" min="0" max="100" value="100">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Outside Saturation: <span id="satVal">100</span>%</label>
                        <input type="range" id="bgSaturation" min="0" max="100" value="100">
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Frame Color</label>
                        <input type="color" id="borderColor" value="#ffffff">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Crosshair</label>
                        <select id="showCross">
                            <option value="none">OFF</option>
                            <option value="show">ON</option>
                        </select>
                    </div>
                </div>
            </div>


            <!-- TEXT 05 (TOP HEADER TRIPLE TEXT) -->
            <div class="control-section glass">
                <h3>Top:</h3>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Playstyle</label>
                        <select id="topHeaderLeft">
                            <option value="STORY" selected>STORY</option>
                            <option value="CHAT/RP">CHAT/RP</option>
                            <option value="GLAMOUR">GLAMOUR</option>
                            <option value="HOUSING">HOUSING</option>
                            <option value="SCREENSHOT">SCREENSHOT</option>
                            <option value="PVP">PVP</option>
                            <option value="CRAFTER">CRAFTER</option>
                            <option value="GATHER">GATHER</option>
                            <option value="RAID">RAID</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>MSQ</label>
                        <select id="topHeaderCenter">
                            <option value="A REALM REBORN">A REALM REBORN</option>
                            <option value="HEAVENSWARD">HEAVENSWARD</option>
                            <option value="STORMBLOOD">STORMBLOOD</option>
                            <option value="SHADOWBRINGERS">SHADOWBRINGERS</option>
                            <option value="ENDWALKER">ENDWALKER</option>
                            <option value="DAWNTRAIL" selected>DAWNTRAIL</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Race</label>
                        <select id="topHeaderRight">
                            <option value="HYUR" selected>Hyur</option>
                            <option value="ELEZEN">Elezen</option>
                            <option value="LALAFELL">Lalafell</option>
                            <option value="MIQO'TE">Miqo'te</option>
                            <option value="ROEGADYN">Roegadyn</option>
                            <option value="AU RA">Au Ra</option>
                            <option value="HROTHGAR">Hrothgar</option>
                            <option value="VIERA">Viera</option>
                        </select>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Size</label>
                        <input type="number" id="topHeaderSize" value="12" min="10" max="14">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Color</label>
                        <input type="color" id="topHeaderColor" value="#ffffff">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label style="font-size: 9px; white-space: nowrap;">Color Inversion</label>
                        <select id="topHeaderInvert">
                            <option value="off" selected>OFF</option>
                            <option value="on">ON</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TEXT 01 (TITLE - FF14 JOB) + TEXT 02 (BODY - WORLD/DC) 共通パネル -->
            <div class="control-section glass">
                <h3>MAIN:</h3>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Job</label>
                        <select id="titleText">
                            <optgroup label="-- TANK --">
                                <option value="PALADIN" selected>Paladin</option>
                                <option value="WARRIOR">Warrior</option>
                                <option value="DARK KNIGHT">Dark Knight</option>
                                <option value="GUNBREAKER">Gunbreaker</option>
                            </optgroup>
                            <optgroup label="-- HEALER --">
                                <option value="WHITE MAGE">White Mage</option>
                                <option value="SCHOLAR">Scholar</option>
                                <option value="ASTROLOGIAN">Astrologian</option>
                                <option value="SAGE">Sage</option>
                            </optgroup>
                            <optgroup label="-- MELEE DPS --">
                                <option value="MONK">Monk</option>
                                <option value="DRAGOON">Dragoon</option>
                                <option value="NINJA">Ninja</option>
                                <option value="SAMURAI">Samurai</option>
                                <option value="REAPER">Reaper</option>
                                <option value="VIPER">Viper</option>
                            </optgroup>
                            <optgroup label="-- PHYSICAL RANGED DPS --">
                                <option value="BARD">Bard</option>
                                <option value="MACHINIST">Machinist</option>
                                <option value="DANCER">Dancer</option>
                            </optgroup>
                            <optgroup label="-- MAGICAL RANGED DPS --">
                                <option value="BLACK MAGE">Black Mage</option>
                                <option value="SUMMONER">Summoner</option>
                                <option value="RED MAGE">Red Mage</option>
                                <option value="PICTOMANCER">Pictomancer</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>World</label>
                        <select id="bodyText">
                            <option value="Secret">Secret</option>
                            <optgroup label="-- Elemental (JP) --">
                                <option value="Elemental / Secret">Secret</option>
                                <option value="Elemental / Aegis">Aegis</option>
                                <option value="Elemental / Atomos">Atomos</option>
                                <option value="Elemental / Carbuncle">Carbuncle</option>
                                <option value="Elemental / Garuda">Garuda</option>
                                <option value="Elemental / Gungnir">Gungnir</option>
                                <option value="Elemental / Kujata">Kujata</option>
                                <option value="Elemental / Tonberry">Tonberry</option>
                                <option value="Elemental / Typhon">Typhon</option>
                            </optgroup>
                            <optgroup label="-- Gaia (JP) --">
                                <option value="Gaia / Secret">Secret</option>
                                <option value="Gaia / Alexander">Alexander</option>
                                <option value="Gaia / Bahamut">Bahamut</option>
                                <option value="Gaia / Durandal">Durandal</option>
                                <option value="Gaia / Fenrir">Fenrir</option>
                                <option value="Gaia / Ifrit">Ifrit</option>
                                <option value="Gaia / Ridill">Ridill</option>
                                <option value="Gaia / Tiamat">Tiamat</option>
                                <option value="Gaia / Ultima">Ultima</option>
                            </optgroup>
                            <optgroup label="-- Mana (JP) --">
                                <option value="Mana / Secret">Secret</option>
                                <option value="Mana / Anima">Anima</option>
                                <option value="Mana / Asura">Asura</option>
                                <option value="Mana / Chocobo">Chocobo</option>
                                <option value="Mana / Hades">Hades</option>
                                <option value="Mana / Ixion" selected>Ixion</option>
                                <option value="Mana / Masamune">Masamune</option>
                                <option value="Mana / Pandaemonium">Pandaemonium</option>
                                <option value="Mana / Titan">Titan</option>
                            </optgroup>
                            <optgroup label="-- Meteor (JP) --">
                                <option value="Meteor / Secret">Secret</option>
                                <option value="Meteor / Belias">Belias</option>
                                <option value="Meteor / Mandragora">Mandragora</option>
                                <option value="Meteor / Ramuh">Ramuh</option>
                                <option value="Meteor / Shinryu">Shinryu</option>
                                <option value="Meteor / Unicorn">Unicorn</option>
                                <option value="Meteor / Valefor">Valefor</option>
                                <option value="Meteor / Yojimbo">Yojimbo</option>
                                <option value="Meteor / Zeromus">Zeromus</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Position</label>
                        <select id="textPosition">
                            <option value="bottom" selected>BOTTOM</option>
                            <option value="top">TOP</option>
                            <option value="left">LEFT</option>
                            <option value="right">RIGHT</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Align<span id="textAlignNote" style="color:var(--text-sub); font-size:9px;"></span></label>
                        <select id="textAlign">
                            <option value="left" selected>LEFT</option>
                            <!-- <option value="center">CENTER</option> -->
                            <option value="right">RIGHT</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;" id="textVAlignGroup">
                        <label>V-Align</label>
                        <select id="textVAlign">
                            <option value="top" selected>TOP</option>
                            <option value="bottom">BOTTOM</option>
                        </select>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Size</label>
                        <input type="number" id="textSize" value="20" min="16" max="30">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Color</label>
                        <input type="color" id="textColor" value="#ffffff">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label style="font-size: 9px; white-space: nowrap;">Color Inversion</label>
                        <select id="textInvert">
                            <option value="off" selected>OFF</option>
                            <option value="on">ON</option>
                        </select>
                    </div>
                </div>
            </div>


            <!-- TEXT 03 -->
            <div class="control-section glass">
                <h3>FOOTER:</h3>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Name</label>
                        <input type="text" id="extraText" value="" placeholder="NAME">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Type</label>
                        <select id="extraType">
                            <option value="reveal">IMAGE REVEAL</option>
                            <option value="white" selected>SOLID WHITE</option>
                            <option value="outline">OUTLINE (TRANSPARENT)</option>
                        </select>
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Align</label>
                        <select id="extraAlign">
                            <option value="left">LEFT</option>
                            <option value="center" selected>CENTER</option>
                            <option value="right">RIGHT</option>
                        </select>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group" style="flex: 1;">
                        <label>Size</label>
                        <input type="number" id="extraSize" value="60" min="60" max="180">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label>Color</label>
                        <input type="color" id="extraColor" value="#ffffff">
                    </div>
                    <div class="control-group" style="flex: 1;">
                        <label style="font-size: 9px; white-space: nowrap;">Color Inversion</label>
                        <select id="extraInvert">
                            <option value="off" selected>OFF</option>
                            <option value="on">ON</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>

        <!-- プレビューエリア -->
        <div class="preview-area">
            <div class="preview-header" id="previewHeader">
                <span>PREVIEW:</span>
                <span id="renderStatus">READY</span>
            </div>
            <div id="viewer-container">
                <canvas id="mainCanvas"></canvas>
                <div id="crop-box">
                    <div class="handle handle-tl" data-handle="tl"></div>
                    <div class="handle handle-tr" data-handle="tr"></div>
                    <div class="handle handle-bl" data-handle="bl"></div>
                    <div class="handle handle-br" data-handle="br"></div>
                </div>
            </div>
            <!-- <div class="help-text" id="helpText">TIP: プレビューはCanvas描画そのもので、ダウンロード画像と完全に同一です。</div> -->
        </div>
    </div>

    <!-- 保存確認モーダル -->
    <div id="saveModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span>EXPORT PREVIEW</span>
                <button id="modalCloseBtn" class="modal-close-btn" aria-label="close">&times;</button>
            </div>
            <div class="modal-image-wrap">
                <img id="modalImage" alt="Generated export">
            </div>
            <div class="modal-help-text">画像を右クリックor長押しでも保存できます</div>
            <div class="modal-actions">
                <a id="modalDownloadLink" class="btn modal-download-btn" download="postercard.png">SAVE IMAGE</a>
                <button id="modalCloseBtn2" class="btn">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
